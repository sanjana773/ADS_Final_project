<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detection - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
</head>
<body>

<div class="background">
    <img src="{{ url_for('static', filename='img/tomato.jpg') }}" alt="Tomato Plant">
</div>

<div class="signup-container">

```
<div class="left-section">

    <div class="logo">
        🌿
    </div>

    <h1>Plant Disease<br>Detection</h1>

    <p>
        Create your account and start
        detecting plant diseases using
        deep learning technology.
    </p>

</div>

<div class="right-section">

    <div class="signup-box">

        <h2>Create Account</h2>

        <p class="subtitle">
            Sign up to get started
        </p>

        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <form id="signupForm" method="POST" action="{{ url_for('signup') }}">

            <div class="input-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 6 characters"
                    required>

            </div>

            <div class="input-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required>

            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</div>
```

</div>

<script src="{{ url_for('static', filename='js/signup.js') }}"></script>

</body>
</html>
